[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "volkano"
version = "0.0.1"
description = "Pure-Python Vulkan driver interface — ctypes-based, lazy registry-driven, zero compiled code in the wheel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Grønli", email = "thomas.gronli@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
include = ["volkano*"]
exclude = ["tests*"]

# PEP 561 marker. Without it a type checker ignores __init__.pyi even
# once it exists. The stub itself is generated on the user's machine by
# `python -m volkano update` rather than shipped, because it describes
# whichever vk.xml that machine is actually built against — so it is
# deliberately absent from the wheel. Importing volkano does not write
# it; a stale or missing stub costs autocomplete and nothing else.
[tool.setuptools.package-data]
volkano = ["py.typed"]

